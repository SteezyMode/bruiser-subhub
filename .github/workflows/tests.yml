name: Offline tests
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: bash -n tools/install_plamo3_small_ab.sh
      - run: bash -n tools/run_plamo3_real_film_ab.sh
      - run: bash -n tools/run_plamo3_8b_challenger.sh
      - run: bash -n tools/run_plamo3_source_first_american_dad.sh
      - run: bash -n tools/run_plamo8b_american_dad_existing_en_batch.sh
      - run: bash -n tools/resume_plamo8b_american_dad_overnight.sh
      - run: python -m unittest discover -p 'test_*.py' -v
