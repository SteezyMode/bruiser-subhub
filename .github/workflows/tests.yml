name: Offline tests
on:
  # A feature branch is validated by its PR, not by a duplicate push run.
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: offline-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: bash -n tools/install_plamo3_small_ab.sh
      - run: bash -n tools/run_plamo3_real_film_ab.sh
      - run: bash -n tools/run_plamo3_8b_challenger.sh
      - run: bash -n tools/run_plamo3_source_first_american_dad.sh
      - run: bash -n tools/run_plamo8b_american_dad_existing_en_batch.sh
      - run: bash -n tools/resume_plamo8b_american_dad_overnight.sh
      - run: bash -n tools/install_american_dad_held_recovery.sh
      - run: bash -n tools/install_subhub_dashboard.sh
      - run: bash -n tools/install_bazarr_trial.sh
      - name: Check dashboard JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('tools/subhub_dashboard.html').read_text('utf-8')
          script = html.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/subhub-dashboard-check.js').write_text(script)
          PY
          node --check /tmp/subhub-dashboard-check.js
      - run: python -m unittest discover -p 'test_*.py' -v
